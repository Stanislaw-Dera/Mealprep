name: mealprep
description: "Osobista aplikacja do meal prepu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # Wbudowana baza: produkty i przepisy startowe (z folderu data/)
  assets:
    - data/products.json
    - data/recipes/
    # Dźwięk końca minutnika (tools/make_timer_sound.py)
    - assets/sounds/
